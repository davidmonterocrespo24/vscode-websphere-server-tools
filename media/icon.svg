<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- server stack -->
  <g filter="url(#shadow)">
    <rect x="44" y="50" width="150" height="40" rx="10" fill="url(#unit)"/>
    <rect x="44" y="100" width="150" height="40" rx="10" fill="url(#unit)"/>
    <rect x="44" y="150" width="150" height="40" rx="10" fill="url(#unit)"/>
  </g>
  <g fill="#22c55e">
    <circle cx="66" cy="70" r="7"/>
    <circle cx="66" cy="120" r="7"/>
    <circle cx="66" cy="170" r="7"/>
  </g>
  <g stroke="#64748b" stroke-width="7" stroke-linecap="round">
    <path d="M90 70h62M90 120h62M90 170h40"/>
  </g>

  <!-- hot deploy badge -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="186" r="46" fill="url(#badge)" stroke="#0b1530" stroke-width="8"/>
  </g>
  <path d="M193 154 L165 192 H184 L177 218 L208 178 H189 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
</svg>
