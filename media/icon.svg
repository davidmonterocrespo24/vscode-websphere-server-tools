<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#glow)"/>

  <!-- isometric server tower -->
  <ellipse cx="122" cy="218" rx="70" ry="12" fill="#000" opacity="0.35"/>
  <path d="M60 78 L122 110 L122 216 L60 184 Z" fill="url(#left)"/>
  <path d="M122 110 L184 78 L184 184 L122 216 Z" fill="url(#right)"/>
  <path d="M122 46 L184 78 L122 110 L60 78 Z" fill="#ecfeff"/>
  <path d="M60 78 L122 110 L184 78" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- drive bays on the front face -->
  <g stroke="#164e63" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M74 108 L108 126"/>
    <path d="M74 132 L108 150"/>
    <path d="M74 156 L108 174"/>
  </g>
  <g fill="#4ade80">
    <circle cx="100" cy="186" r="5.5"/>
  </g>

  <!-- hot deploy bolt -->
  <path transform="translate(-8 10)" d="M206 30 L168 96 H194 L180 150 L230 74 H202 Z" fill="url(#bolt)" stroke="#020617" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/>
</svg>
